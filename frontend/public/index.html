<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; margin: 0; }
    .container { max-width: 400px; margin: 80px auto; background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #2563eb; text-align: center; margin-top: 0; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: 500; }
    button:hover { background: #1d4ed8; }
    .error { color: #dc2626; background: #fef2f2; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 14px; }
    .success { color: #16a34a; background: #f0fdf4; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const API = 'https://ecampus-hainaut.onrender.com/api';

    function renderLogin(error = '') {
      document.getElementById('app').innerHTML = `
        <div class="container">
          <h1>CampusConnect</h1>
          <p style="text-align:center;color:#666;margin-bottom:24px">Réseau social de votre établissement</p>
          ${error ? `<div class="error">${error}</div>` : ''}
          <form id="loginForm">
            <input type="email" id="email" placeholder="Adresse e-mail institutionnelle" required />
            <input type="password" id="password" placeholder="Mot de passe" required />
            <button type="submit">Se connecter</button>
          </form>
          <p style="text-align:center;font-size:13px;color:#888;margin-top:20px">
            Contactez l'administration pour obtenir un compte.
          </p>
        </div>
      `;
      document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
          const res = await fetch(API + '/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Identifiants incorrects');
          localStorage.setItem('token', data.access);
          renderFeed();
        } catch (err) {
          renderLogin(err.message);
        }
      };
    }

    async function renderFeed() {
      const token = localStorage.getItem('token');
      if (!token) return renderLogin();
      document.getElementById('app').innerHTML = '<div class="container"><p>Chargement...</p></div>';
      try {
        const res = await fetch(API + '/posts/feed/', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.status === 401) {
          localStorage.removeItem('token');
          return renderLogin('Session expirée');
        }
        const data = await res.json();
        const posts = data.results || data || [];
        document.getElementById('app').innerHTML = `
          <div style="max-width:600px;margin:20px auto;padding:0 16px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
              <h1 style="color:#2563eb;margin:0">CampusConnect</h1>
              <button onclick="localStorage.removeItem('token');location.reload()" style="width:auto;padding:8px 16px">Déconnexion</button>
            </div>
            <h2>Fil d'actualité</h2>
            ${posts.length === 0 
              ? '<div class="container"><p style="text-align:center;color:#666">Aucune publication</p></div>'
              : posts.map(p => `
                <div class="container" style="margin-bottom:12px">
                  <strong>${p.author_detail?.full_name || 'Utilisateur'}</strong>
                  <p style="margin:8px 0">${p.content || ''}</p>
                  <small style="color:#888">${new Date(p.created_at).toLocaleString('fr-FR')}</small>
                </div>
              `).join('')
            }
          </div>
        `;
      } catch (err) {
        document.getElementById('app').innerHTML = `<div class="container"><div class="error">Erreur: ${err.message}</div></div>`;
      }
    }

    if (localStorage.getItem('token')) {
      renderFeed();
    } else {
      renderLogin();
    }
  </script>
</body>
</html>
